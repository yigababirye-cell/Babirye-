<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Modern Web Calculator</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
      font-family: Arial, Helvetica, sans-serif;
      background: linear-gradient(135deg, #101827, #243b55);
      color: #f8fafc;
    }

    .page {
      width: 100%;
      max-width: 390px;
    }

    .heading {
      text-align: center;
      margin-bottom: 18px;
    }

    .heading h1 {
      font-size: 1.55rem;
      margin-bottom: 7px;
      letter-spacing: 0.3px;
    }

    .heading p {
      color: #b8c5d6;
      font-size: 0.9rem;
    }

    .calculator {
      padding: 22px;
      border: 1px solid rgba(255, 255, 255, 0.13);
      border-radius: 25px;
      background: rgba(15, 23, 42, 0.92);
      box-shadow: 0 22px 55px rgba(0, 0, 0, 0.35);
    }

    .display {
      min-height: 112px;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: flex-end;
      overflow: hidden;
      padding: 15px 12px 20px;
      margin-bottom: 18px;
      border-radius: 16px;
      background: #0b1220;
      border: 1px solid #273449;
    }

    .previous {
      width: 100%;
      min-height: 22px;
      color: #94a3b8;
      text-align: right;
      font-size: 0.95rem;
      overflow-wrap: anywhere;
    }

    .current {
      width: 100%;
      margin-top: 8px;
      text-align: right;
      font-size: clamp(2rem, 8vw, 2.65rem);
      font-weight: 600;
      overflow-wrap: anywhere;
    }

    .keys {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }

    button {
      min-height: 59px;
      border: none;
      border-radius: 15px;
      background: #263449;
      color: #f8fafc;
      font-size: 1.2rem;
      font-weight: 600;
      cursor: pointer;
      transition: transform 0.12s ease, filter 0.12s ease;
      box-shadow: inset 0 -3px 0 rgba(0, 0, 0, 0.12);
    }

    button:hover {
      filter: brightness(1.15);
    }

    button:active {
      transform: scale(0.96);
    }

    button:focus-visible {
      outline: 3px solid #7dd3fc;
      outline-offset: 2px;
    }

    .utility {
      background: #42516a;
    }

    .operator {
      background: #0e7490;
    }

    .clear {
      background: #be4560;
    }

    .equals {
      background: #16a085;
      grid-row: span 2;
    }

    .zero {
      grid-column: span 2;
    }

    .footer {
      margin-top: 15px;
      text-align: center;
      color: #b8c5d6;
      font-size: 0.78rem;
    }

    @media (max-width: 360px) {
      .calculator { padding: 15px; }
      .keys { gap: 7px; }
      button { min-height: 53px; border-radius: 12px; }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="heading">
      <h1>Modern Calculator</h1>
      <p>A simple, responsive web calculator</p>
    </header>

    <section class="calculator" aria-label="Calculator">
      <div class="display" aria-live="polite" aria-atomic="true">
        <div class="previous" id="previous"></div>
        <div class="current" id="current">0</div>
      </div>

      <div class="keys">
        <button class="clear" data-action="clear">AC</button>
        <button class="utility" data-action="delete" aria-label="Delete last digit">DEL</button>
        <button class="utility" data-action="sign">+/-</button>
        <button class="operator" data-operator="/">÷</button>

        <button data-number="7">7</button>
        <button data-number="8">8</button>
        <button data-number="9">9</button>
        <button class="operator" data-operator="*">×</button>

        <button data-number="4">4</button>
        <button data-number="5">5</button>
        <button data-number="6">6</button>
        <button class="operator" data-operator="-">−</button>

        <button data-number="1">1</button>
        <button data-number="2">2</button>
        <button data-number="3">3</button>
        <button class="operator" data-operator="+">+</button>

        <button class="zero" data-number="0">0</button>
        <button data-action="decimal">.</button>
        <button class="equals" data-action="equals">=</button>
      </div>
    </section>

    <p class="footer">Designed with HTML, CSS and JavaScript</p>
  </main>

  <script>
    const currentDisplay = document.getElementById("current");
    const previousDisplay = document.getElementById("previous");
    const keys = document.querySelector(".keys");

    let currentValue = "0";
    let previousValue = "";
    let operator = null;
    let shouldResetScreen = false;

    function updateDisplay() {
      currentDisplay.textContent = currentValue;
      previousDisplay.textContent = operator && previousValue !== ""
        ? `${previousValue} ${displayOperator(operator)}`
        : "";
    }

    function displayOperator(value) {
      return value === "*" ? "×" : value === "/" ? "÷" : value;
    }

    function inputNumber(number) {
      if (currentValue === "Error" || shouldResetScreen) {
        currentValue = number;
        shouldResetScreen = false;
      } else {
        currentValue = currentValue === "0" ? number : currentValue + number;
      }
      updateDisplay();
    }

    function inputDecimal() {
      if (currentValue === "Error" || shouldResetScreen) {
        currentValue = "0.";
        shouldResetScreen = false;
      } else if (!currentValue.includes(".")) {
        currentValue += ".";
      }
      updateDisplay();
    }

    function chooseOperator(nextOperator) {
      if (currentValue === "Error") return;
      if (operator && !shouldResetScreen) calculate();
      previousValue = currentValue;
      operator = nextOperator;
      shouldResetScreen = true;
      updateDisplay();
    }

    function calculate() {
      if (!operator || previousValue === "") return;
      const first = Number(previousValue);
      const second = Number(currentValue);
      let result;

      switch (operator) {
        case "+": result = first + second; break;
        case "-": result = first - second; break;
        case "*": result = first * second; break;
        case "/":
          if (second === 0) {
            currentValue = "Error";
            previousValue = "";
            operator = null;
            shouldResetScreen = true;
            updateDisplay();
            return;
          }
          result = first / second;
          break;
        default: return;
      }

      currentValue = Number.isFinite(result)
        ? String(Number(result.toPrecision(10)))
        : "Error";
      previousValue = "";
      operator = null;
      shouldResetScreen = true;
      updateDisplay();
    }

    function clearCalculator() {
      currentValue = "0";
      previousValue = "";
      operator = null;
      shouldResetScreen = false;
      updateDisplay();
    }

    function deleteLastDigit() {
      if (currentValue === "Error" || shouldResetScreen) {
        currentValue = "0";
        shouldResetScreen = false;
      } else {
        currentValue = currentValue.length > 1
          ? currentValue.slice(0, -1)
          : "0";
        if (currentValue === "-") currentValue = "0";
      }
      updateDisplay();
    }

    function toggleSign() {
      if (currentValue === "0" || currentValue === "Error") return;
      currentValue = currentValue.startsWith("-")
        ? currentValue.slice(1)
        : "-" + currentValue;
      updateDisplay();
    }

    keys.addEventListener("click", (event) => {
      const button = event.target.closest("button");
      if (!button) return;

      if (button.dataset.number !== undefined) inputNumber(button.dataset.number);
      else if (button.dataset.operator) chooseOperator(button.dataset.operator);
      else {
        switch (button.dataset.action) {
          case "clear": clearCalculator(); break;
          case "delete": deleteLastDigit(); break;
          case "decimal": inputDecimal(); break;
          case "sign": toggleSign(); break;
          case "equals": calculate(); break;
        }
      }
    });

    document.addEventListener("keydown", (event) => {
      if (/^[0-9]$/.test(event.key)) inputNumber(event.key);
      else if (event.key === ".") inputDecimal();
      else if (["+", "-", "*", "/"].includes(event.key)) chooseOperator(event.key);
      else if (event.key === "Enter" || event.key === "=") calculate();
      else if (event.key === "Backspace") deleteLastDigit();
      else if (event.key === "Escape") clearCalculator();
    });

    updateDisplay();
  </script>
</body>
</html>
